name: Build JianshiTV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 34
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk JianshiTV-v1.0.0.apk
          ls -lh JianshiTV-v1.0.0.apk
          sha256sum JianshiTV-v1.0.0.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JianshiTV-apk
          path: JianshiTV-v1.0.0.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: 简视TV v1.0.0
          body: 适用于小米 REDMI 智能电视 A65 (L65RB-RAE) 的 Android TV 看电视应用。
          files: JianshiTV-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
